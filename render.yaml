# Render Blueprint — API + worker (deploy: Render dashboard → New → Blueprint → this repo).
# Region matches Supabase us-east-1 (N. Virginia) to keep DB latency low.
services:
  - type: web
    name: fanzup-api
    runtime: node
    region: virginia
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @fanzup/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true   # in the dashboard, set Auto-Deploy to "After CI checks pass" (see SETUP.md)
    buildFilter:
      paths: ["apps/api/**", "packages/shared/**", "pnpm-lock.yaml"]
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ESCROW_PROVIDER
        value: stripe-dev
      - key: CORS_ORIGINS
        sync: false

  - type: worker
    name: fanzup-worker
    runtime: node
    region: virginia
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @fanzup/api build
    startCommand: node apps/api/dist/worker.js
    autoDeploy: true
    buildFilter:
      paths: ["apps/api/**", "packages/shared/**", "pnpm-lock.yaml"]
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - fromService: { type: web, name: fanzup-api, envVarKey: DATABASE_URL }
        key: DATABASE_URL
      - fromService: { type: web, name: fanzup-api, envVarKey: SUPABASE_URL }
        key: SUPABASE_URL
      - fromService: { type: web, name: fanzup-api, envVarKey: STRIPE_SECRET_KEY }
        key: STRIPE_SECRET_KEY
      - key: ESCROW_PROVIDER
        value: stripe-dev
