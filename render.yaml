# Render Blueprint — background WORKER only (ADR-002).
# The website and API run on Vercel (root vercel.json). This always-on process settles campaigns at their
# deadline and drains the outbox (refunds, milestone payouts) every 30 seconds.
# Deploy: Render dashboard → New → Blueprint → this repo.
services:
  - type: worker
    name: fanzup-worker
    runtime: node
    region: virginia            # next to Supabase us-east-1
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @fanzup/api build
    startCommand: node apps/api/dist/worker.js
    autoDeploy: true            # in the dashboard, set Auto-Deploy to "After CI checks pass"
    buildFilter:
      paths: ["apps/api/**", "packages/shared/**", "supabase/migrations/**", "pnpm-lock.yaml"]
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL       # Supabase → Connect → Session pooler (port 5432); long-running process
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: ESCROW_PROVIDER
        value: stripe-dev
      - key: DB_POOL_MAX
        value: "5"
