name: Deploy database migrations

# Runs only when migrations change on main (or by hand). Each environment is a GitHub
# Environment with required reviewers, so production migrations always need your approval.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      include_seed:
        description: "Staging only: also load supabase/seed.sql (demo artists + test users). Never used for production."
        type: boolean
        default: false

permissions:
  contents: read

# Off until Supabase + GitHub environments are set up (docs/SETUP.md Part E):
# set the repository variable DB_DEPLOY_ENABLED = true to turn it on.
jobs:
  staging:
    if: vars.DB_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with: { version: latest }
      - run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
      - run: supabase db push ${{ inputs.include_seed && '--include-seed' || '' }}

  production:
    # Off until a separate production project exists: set repository variable PROD_DEPLOY_ENABLED = true.
    if: vars.PROD_DEPLOY_ENABLED == 'true'
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with: { version: latest }
      - run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
      - run: supabase db push
