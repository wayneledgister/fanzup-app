name: Deploy database migrations

# Manual fallback only. Migrations normally deploy through Supabase's own GitHub integration
# (Supabase > Project Settings > Integrations > GitHub, "Deploy to production" on main), which
# needs no GitHub secrets. Running both on every push would race, so this one never auto-runs.
on:
  workflow_dispatch:
    inputs:
      include_seed:
        description: "Staging only: also load supabase/seed.sql (demo artists + test users). Never used for production."
        type: boolean
        default: false

permissions:
  contents: read

# Off until Supabase + GitHub environments are set up (docs/SETUP.md Part E):
# set the repository variable DB_DEPLOY_ENABLED = true to turn it on.
jobs:
  staging:
    if: vars.DB_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # The staging project ref isn't secret (it's in the project URL); the variable overrides it.
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'trreozwlpvgbcioatmrn' }}
    steps:
      - name: Check settings
        # Fail with a readable message instead of a CLI usage dump. Names only, never values.
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing secret:SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing secret:SUPABASE_DB_PASSWORD"
          [ -n "$PROJECT_REF" ] || missing="$missing variable:SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Missing in the '${{ github.job }}' environment:$missing (Settings > Environments > ${{ github.job }}; see docs/SETUP.md Part E)"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with: { version: latest }
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push ${{ inputs.include_seed && '--include-seed' || '' }}

  production:
    # Off until a separate production project exists: set repository variable PROD_DEPLOY_ENABLED = true.
    if: vars.PROD_DEPLOY_ENABLED == 'true'
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # No default: production must name its own project explicitly.
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check settings
        # Fail with a readable message instead of a CLI usage dump. Names only, never values.
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing secret:SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing secret:SUPABASE_DB_PASSWORD"
          [ -n "$PROJECT_REF" ] || missing="$missing variable:SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Missing in the '${{ github.job }}' environment:$missing (Settings > Environments > ${{ github.job }}; see docs/SETUP.md Part E)"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with: { version: latest }
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push
